name: bebsho
description: Offline English learning app for kids by voice
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  vosk_flutter: ^0.3.48
  flutter_tts: ^4.2.5
  permission_handler: ^11.3.1
  shared_preferences: ^2.5.5
  audioplayers: ^6.8.1
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  permission_handler: ^11.3.1
  permission_handler_android: ^12.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/models/vosk-model-small-en-us-0.15.zip
    - assets/words.json
    - assets/sentences.json